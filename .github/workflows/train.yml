name: Train Thermal UDE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "train.jl"
      - "Project.toml"
      - "Case_1/**"
      - "Case_2/**"
      - ".github/workflows/train.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      # Reduced iteration budget so the workflow finishes quickly; omit
      # these (or set larger values, see train.jl) for a full reproduction
      # run matching the real 5500-iter mini-batch / target-0.1 / target-3.5
      # training recipe described in CLAUDE.md.
      UDE_MINIBATCH_ITERS: "300"
      UDE_CASE1_ADAM_MAX_ITERS: "500"
      UDE_CASE1_PLATEAU_WINDOW: "50"
      UDE_CASE1_BFGS_ITERS: "20"
      UDE_CASE1_MAX_ROUNDS: "2"
      UDE_CASE2_ADAM_MAX_ITERS: "500"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Train Case 1
        run: julia --project=. train.jl 1

      - name: Train Case 2
        run: julia --project=. train.jl 2

      - name: Upload training results
        uses: actions/upload-artifact@v4
        with:
          name: thermal-ude-training-results
          path: results/
          if-no-files-found: error
