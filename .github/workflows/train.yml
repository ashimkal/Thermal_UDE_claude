name: Train Thermal UDE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "train.jl"
      - "Project.toml"
      - "Case_1/**"
      - "Case_2/**"
      - ".github/workflows/train.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    # No env overrides here: this runs train.jl's real training budget
    # (5500-iter mini-batch, converging to the 0.1 / 3.5 loss targets
    # described in CLAUDE.md), which can take a long time. timeout-minutes
    # is a safety net against a run that never converges and just burns
    # through max_iters.
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Train Case 1
        run: julia --project=. train.jl 1

      - name: Train Case 2
        run: julia --project=. train.jl 2

      - name: Upload training results
        uses: actions/upload-artifact@v4
        with:
          name: thermal-ude-training-results
          path: results/
          if-no-files-found: error
